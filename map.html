<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Research Group — World Map</title>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@300&display=swap" rel="stylesheet"/>
  <script src="https://cdn.plot.ly/plotly-2.35.2.min.js" charset="utf-8"></script>
  <style>
    *{box-sizing:border-box;margin:0;padding:0}
    body{
      font-family:'Lato',sans-serif;
      font-weight:300;
      background:transparent;
      display:flex;
      flex-direction:column;
      align-items:center;
      padding:1rem 1rem 1.5rem;
      color:#1a1a1a;
    }
    h1{
      font-family:'Lato',sans-serif;
      font-weight:300;
      font-size:1.1rem;
      letter-spacing:.1em;
      text-transform:uppercase;
      color:#666;
      margin-bottom:1.25rem;
    }
    #map-wrap{
      width:100%;
      max-width:960px;
      border-radius:10px;
      overflow:hidden;
      box-shadow:0 2px 20px rgba(0,0,0,.1);
    }
    #map{width:100%;}
    .legend{
      display:flex;gap:24px;margin-top:1rem;
      justify-content:center;font-size:16px;color:#555;
      font-family:'Lato',sans-serif;font-weight:300;
    }
    .legend-item{display:flex;align-items:center;gap:8px;}
    .dot{
      width:14px;height:14px;border-radius:50%;
      border:2px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,.2);
    }

    /* ============================================================
       EDIT YOUR MEMBERS IN THE <script> BLOCK BELOW
       ============================================================ */
  </style>
</head>
<body>

<h1>Research Group &mdash; Where We Come From</h1>
<div id="map-wrap"><div id="map"></div></div>
<div class="legend">
  <div class="legend-item">
    <div class="dot" style="background:#E24B4A;"></div>
    Current member
  </div>
  <div class="legend-item">
    <div class="dot" style="background:#378ADD;"></div>
    Alumni
  </div>
</div>

<!-- ============================================================
  EDIT YOUR MEMBERS HERE
  Each entry:
    name  — person's name
    role  — role in the group (e.g. "PhD student", "Postdoc", "Research assistant")
    city  — city label shown in tooltip
    lat   — latitude  (negative = South)
    lon   — longitude (negative = West)
    type  — "current"  → red pin
             "alumni"   → blue pin

  Tip: google "<city> coordinates" to find lat/lon.
============================================================ -->
<script>
var members = [
  { name: "Gabriel A. Maciel",  role: "Postdoc",        city: "Curitiba, PR",  lat: -25.43,  lon: -49.26,  type: "alumni" },
  { name: "Member Name",  role: "Postdoc",             city: "Madrid",        lat: 40.42,  lon:  -3.70,  type: "current" },
  { name: "Alumni Name",  role: "Former PhD student",  city: "Berlin",        lat: 52.52,  lon:  13.40,  type: "alumni"  },
  { name: "Alumni Name",  role: "Former Postdoc",      city: "New York",      lat: 40.71,  lon: -74.01,  type: "alumni"  },
  { name: "Alumni Name",  role: "Former PhD student",  city: "Tokyo",         lat: 35.68,  lon: 139.69,  type: "alumni"  },
];
</script>

  var currentMembers = members.filter(function(m){ return m.type === "current"; });
  var alumni         = members.filter(function(m){ return m.type === "alumni";  });

  function makeTrace(group, color, label){
    return {
      type: "scattergeo",
      mode: "markers",
      name: label,
      lat: group.map(function(m){ return m.lat; }),
      lon: group.map(function(m){ return m.lon; }),
      text: group.map(function(m){ return "<b>" + m.name + "</b><br>" + (m.role ? m.role + "<br>" : "") + m.city; }),
      hoverinfo: "text",
      marker: {
        size: 10,
        color: color,
        line: { width: 2, color: "#fff" },
        opacity: 0.95,
      },
      showlegend: false,
    };
  }

  var layout = baseLayout.layout || {};
  layout.height = Math.round(document.getElementById("map-wrap").offsetWidth * 0.5) || 480;
  layout.width  = document.getElementById("map-wrap").offsetWidth || 960;

  Plotly.newPlot("map",
    (baseLayout.data || []).concat([
      makeTrace(currentMembers, "#E24B4A", "Current member"),
      makeTrace(alumni,         "#378ADD", "Alumni"),
    ]),
    layout,
    {
      displayModeBar: false,
      responsive: true,
      scrollZoom: false,
    }
  );

  window.addEventListener("resize", function(){
    Plotly.relayout("map", {
      width:  document.getElementById("map-wrap").offsetWidth,
      height: Math.round(document.getElementById("map-wrap").offsetWidth * 0.5),
    });
  });
