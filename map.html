    #map-wrap{
      width:100%;
      max-width:960px;
      border-radius:0px;
      overflow:hidden;
    }
    #map{width:100%;}
    .legend{
      display:flex;gap:24px;margin-top:1rem;

      font-family:'Lato',sans-serif;font-weight:300;
    }
    .legend-item{display:flex;align-items:center;gap:8px;}
    .dot{
      width:14px;height:14px;border-radius:50%;
      border:2px solid #fff;
      box-shadow:0 1px 4px rgba(0,0,0,.2);
    }

    return {
      type: "scattergeo",
      mode: "markers",
      name: label,
      lat: group.map(function(m){ return m.lat; }),

    };
